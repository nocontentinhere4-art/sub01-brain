[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub01-brain"
version = "0.1.0"
description = "The brain model of SUB-01, a fictional simulated character: a rate/Hopf model and spiking networks on one real public connectome. A model, not a mind."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
torch = ["torch>=2.2", "aiohttp>=3.9"]
test = ["pytest>=7"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sub01_brain*"]

[tool.setuptools.package-data]
sub01_brain = ["data/DATA.md", "data/*/LICENSE", "data/*/*.md", "data/*/*.npz", "data/*/*.json", "data/*/*.csv", "data/*/*/*", "data/*/*/*/*"]

# The data files (23 MB; data/DATA.md) ship inside the package, so `pip install` is enough. SUB01_BRAIN_DATA overrides
# them with a directory of the same layout (sub01_brain/paths.py). The top-level `data` is a link to sub01_brain/data.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
